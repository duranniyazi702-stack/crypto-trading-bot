<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Trading Bot Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #ecf0f1;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            border-bottom: 3px solid #00d4ff;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            color: #00d4ff;
        }

        .status-indicator {
            display: inline-block;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: #ff4444;
            margin-left: 10px;
            animation: blink 1s infinite;
        }

        .status-indicator.running {
            background: #00ff00;
            animation: none;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0.3; }
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 20px 0;
        }

        button {
            padding: 12px 30px;
            font-size: 1em;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }

        .btn-start {
            background: #00ff00;
            color: #000;
        }

        .btn-start:hover {
            background: #00dd00;
            transform: scale(1.05);
        }

        .btn-stop {
            background: #ff4444;
            color: #fff;
        }

        .btn-stop:hover {
            background: #dd0000;
            transform: scale(1.05);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .card {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #00d4ff;
            border-radius: 10px;
            padding: 20px;
            backdrop-filter: blur(10px);
        }

        .card h2 {
            color: #00d4ff;
            margin-bottom: 15px;
            font-size: 1.3em;
            border-bottom: 2px solid #00d4ff;
            padding-bottom: 10px;
        }

        .metric {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(0, 212, 255, 0.2);
        }

        .metric:last-child {
            border-bottom: none;
        }

        .metric-label {
            color: #aaa;
        }

        .metric-value {
            color: #00ff00;
            font-weight: bold;
            font-size: 1.1em;
        }

        .trades-table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }

        .trades-table th {
            background: rgba(0, 212, 255, 0.2);
            padding: 12px;
            text-align: left;
            color: #00d4ff;
            border-bottom: 2px solid #00d4ff;
        }

        .trades-table td {
            padding: 10px 12px;
            border-bottom: 1px solid rgba(0, 212, 255, 0.1);
        }

        .trade-buy {
            color: #00ff00;
            font-weight: bold;
        }

        .trade-sell {
            color: #ff4444;
            font-weight: bold;
        }

        .loading {
            text-align: center;
            color: #00d4ff;
            font-style: italic;
        }

        .chart-container {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #00d4ff;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            h1 { font-size: 1.8em; }
            .grid { grid-template-columns: 1fr; }
            .controls { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🤖 Crypto Trading Bot <span class="status-indicator" id="status"></span></h1>
            <p>Binance Trading Platform</p>
        </header>

        <div class="controls">
            <button class="btn-start" onclick="startBot()">▶ Bot Başlat</button>
            <button class="btn-stop" onclick="stopBot()">⏹ Bot Durdur</button>
            <button class="btn-start" onclick="refreshData()" style="background: #00d4ff; color: #000;">🔄 Yenile</button>
        </div>

        <div class="grid">
            <div class="card">
                <h2>📊 Bot Durumu</h2>
                <div class="metric">
                    <span class="metric-label">Durum:</span>
                    <span class="metric-value" id="status-text">-</span>
                </div>
                <div class="metric">
                    <span class="metric-label">İşlem Çifti:</span>
                    <span class="metric-value" id="trading-pair">-</span>
                </div>
                <div class="metric">
                    <span class="metric-label">Günlük İşlem:</span>
                    <span class="metric-value" id="trades-today">0</span>
                </div>
                <div class="metric">
                    <span class="metric-label">Toplam İşlem:</span>
                    <span class="metric-value" id="total-trades">0</span>
                </div>
            </div>

            <div class="card">
                <h2>💰 Bakiye</h2>
                <div class="metric">
                    <span class="metric-label">USDT Bakiye:</span>
                    <span class="metric-value" id="usdt-balance">-</span>
                </div>
                <div class="metric">
                    <span class="metric-label">Coin Bakiye:</span>
                    <span class="metric-value" id="coin-balance">-</span>
                </div>
            </div>

            <div class="card">
                <h2>⚙️ Konfigürasyon</h2>
                <div class="metric">
                    <span class="metric-label">Alış RSI:</span>
                    <span class="metric-value" id="buy-rsi">-</span>
                </div>
                <div class="metric">
                    <span class="metric-label">Satış RSI:</span>
                    <span class="metric-value" id="sell-rsi">-</span>
                </div>
                <div class="metric">
                    <span class="metric-label">EMA Fast:</span>
                    <span class="metric-value" id="ema-fast">-</span>
                </div>
                <div class="metric">
                    <span class="metric-label">EMA Slow:</span>
                    <span class="metric-value" id="ema-slow">-</span>
                </div>
                <div class="metric">
                    <span class="metric-label">Paper Trading:</span>
                    <span class="metric-value" id="paper-trading">-</span>
                </div>
            </div>
        </div>

        <div class="card">
            <h2>📈 Son İşlemler</h2>
            <div id="trades-container" class="loading">Veri yükleniyor...</div>
        </div>
    </div>

    <script>
        async function getStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                
                document.getElementById('status-text').textContent = data.status.toUpperCase();
                document.getElementById('status').className = `status-indicator ${data.status === 'running' ? 'running' : ''}`;
                document.getElementById('trading-pair').textContent = data.trading_pair;
                document.getElementById('trades-today').textContent = data.trades_today;
                document.getElementById('total-trades').textContent = data.total_trades;
                document.getElementById('usdt-balance').textContent = data.usdt_balance.toFixed(2) + ' USDT';
                document.getElementById('coin-balance').textContent = data.coin_balance.toFixed(6);
            } catch (e) {
                console.error('Error:', e);
            }
        }

        async function getTrades() {
            try {
                const response = await fetch('/api/trades');
                const data = await response.json();
                
                if (data.trades.length === 0) {
                    document.getElementById('trades-container').innerHTML = '<p class="loading">Henüz işlem yok</p>';
                    return;
                }

                let html = '<table class="trades-table"><thead><tr><th>Zaman</th><th>İşlem</th><th>Miktar</th><th>Fiyat</th></tr></thead><tbody>';
                
                data.trades.reverse().slice(0, 10).forEach(trade => {
                    const date = new Date(trade.timestamp).toLocaleString('tr-TR');
                    const sideClass = trade.side === 'BUY' ? 'trade-buy' : 'trade-sell';
                    html += `<tr>
                        <td>${date}</td>
                        <td class="${sideClass}">${trade.side}</td>
                        <td>${trade.amount.toFixed(6)}</td>
                        <td>${trade.price.toFixed(2)}</td>
                    </tr>`;
                });
                
                html += '</tbody></table>';
                document.getElementById('trades-container').innerHTML = html;
            } catch (e) {
                console.error('Error:', e);
            }
        }

        async function getConfig() {
            try {
                const response = await fetch('/api/config');
                const data = await response.json();
                
                document.getElementById('buy-rsi').textContent = data.buy_rsi;
                document.getElementById('sell-rsi').textContent = data.sell_rsi;
                document.getElementById('ema-fast').textContent = data.ema_fast;
                document.getElementById('ema-slow').textContent = data.ema_slow;
                document.getElementById('paper-trading').textContent = data.paper_trading ? 'Evet' : 'Hayır';
            } catch (e) {
                console.error('Error:', e);
            }
        }

        async function startBot() {
            try {
                const response = await fetch('/api/start', { method: 'POST' });
                const data = await response.json();
                alert(data.message);
                refreshData();
            } catch (e) {
                alert('Hata: ' + e.message);
            }
        }

        async function stopBot() {
            try {
                const response = await fetch('/api/stop', { method: 'POST' });
                const data = await response.json();
                alert(data.message);
                refreshData();
            } catch (e) {
                alert('Hata: ' + e.message);
            }
        }

        async function refreshData() {
            await getStatus();
            await getTrades();
            await getConfig();
        }

        // Sayfa yüklendiğinde ilk veriyi al
        refreshData();

        // Her 5 saniyede veriyi güncelle
        setInterval(refreshData, 5000);
    </script>
</body>
</html>
